version: 2.1

orbs:
  node: circleci/node@2.1.1
  snyk: snyk/snyk@1.4.0
  prodsec: snyk/prodsec-orb@1

ignore_main_branch_filter: &ignore_main_branch_filter
  filters:
    branches:
      ignore:
        - main

defaults: &defaults
  resource_class: small
  docker:
    - image: cimg/node:24.10.0
  working_directory: ~/sweater-comb

commands:
  setup_npm_auth:
    steps:
      - run:
          name: Setup NPM auth
          command: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
  gcr_auth:
    description: Auth GCR
    steps:
      - run:
          name: GCR auth
          command: echo $GCLOUD_GCR_BUILDER | docker login -u _json_key
            --password-stdin https://gcr.io/snyk-main
  setup_build_remote_docker:
    steps:
      - setup_remote_docker:
          docker_layer_caching: true

jobs:
  scan:
    <<: *defaults
    resource_class: medium
    steps:
      - checkout
      - prodsec/security_scans:
          mode: auto

  test:
    <<: *defaults
    steps:
      - checkout
      - run:
          name: Install
          command: npm ci
      - run:
          name: Lint
          command: npm run lint
      - run:
          name: Build
          command: npm run build
      - run:
          name: Test
          command: npm test
      - run:
          name: E2E Test - Bulk Compare
          command: ./end-end-tests/api-standards/test-bulk.bash
      - run:
          name: E2E Test - Compare
          command: ./end-end-tests/api-standards/test.bash

  npm-release:
    <<: *defaults
    steps:
      - checkout
      # The read-only nodejs-install token satisfies @semantic-release/npm's
      # auth check; the actual publish then uses OIDC (NPM_ID_TOKEN) below.
      - setup_npm_auth
      - node/install-packages:
          app-dir: ~/sweater-comb
          override-ci: true
          cache-key: package.json
      - run:
          name: Build package
          command: npm run build
      - run:
          name: Release
          command: |
            export NPM_ID_TOKEN=$(circleci run oidc get --claims '{"aud": "npm:registry.npmjs.org"}')
            npx semantic-release@25

  rebuild-tools:
    <<: *defaults
    steps:
      - run: |-
          curl -X POST https://circleci.com/api/v2/project/github/snyk/api-tooling/pipeline \
              --header "Circle-Token: $CIRCLE_TOKEN" \
              --header "content-type: application/json" \
              --data '{"branch":"main"}'

workflows:
  version: 2
  test_and_publish:
    jobs:
      - prodsec/secrets-scan:
          <<: *ignore_main_branch_filter
          name: Scan repository for secrets
          trusted-branch: main
          context:
            - snyk-bot-slack
            - prodsec-orb-runtime
          channel: alerts-api

      - scan:
          name: Snyk Vuln Scan
          context:
            - platformeng_api
            - prodsec-orb-runtime

      - test:
          name: Test

      - npm-release:
          name: NPM Release - Tag
          requires:
            - Test
          context:
            - nodejs-install
            - github-release
          filters: &publish_filters
            branches:
              only: "main"
            tags:
              only: /^v.*/

      - rebuild-tools:
          name: Rebuild api-tooling
          context:
            - manage-api-tooling
          requires:
            - NPM Release - Tag
